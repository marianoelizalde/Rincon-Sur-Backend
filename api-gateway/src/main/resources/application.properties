spring.application.name=gateway
server.port=9090
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true
spring.cloud.gateway.routes[0].id=perfiles-route
spring.cloud.gateway.routes[0].uri=lb://perfiles-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/perfiles/**
spring.cloud.gateway.routes[1].id=usuarios-route
spring.cloud.gateway.routes[1].uri=lb://usuarios-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/usuarios/**
spring.cloud.gateway.routes[2].id=accesos-route
spring.cloud.gateway.routes[2].uri=lb://sesiones-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/accesos/**
spring.cloud.gateway.routes[3].id=estados-route
spring.cloud.gateway.routes[3].uri=lb://sesiones-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/estados-sesion/**
spring.cloud.gateway.routes[4].id=sesiones-route
spring.cloud.gateway.routes[4].uri=lb://sesiones-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/sesiones/**
spring.cloud.gateway.routes[5].id=registros-route
spring.cloud.gateway.routes[5].uri=lb://registros-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/registros/**
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
